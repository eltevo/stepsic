# profile-large.toml
#
# Purpose: Large opt-in profiling run for full-scale memory/FFT behavior.
# Tools:    cProfile (cumtime/tottime), scalene (line-level), py-spy (flamegraph)
# Grid:     768^3 particles on a 324^3 FFT mesh; expensive, run explicitly.

# -- 1. Geometry -----------------------------------------------------------
GEOMETRY    = "cubical"
LBOX        = 1500
PERIODIC    = true
COI         = [0, 0, 0]

# Stereographic params (unused for cubical, but always validated)
R_3D = 250
D_4D = 75

# -- 2. Particle generation ------------------------------------------------
TYPE  = "grid"
NGRID = 768
SEED  = 137

# -- 3. Perturbation theory ------------------------------------------------
NMESH         = 324
LPTORDER      = 2
REDSHIFT      = 63
INTERPOLATION = "cic"
COMPENSATE    = false
SPHEREMODE    = false
PAIRED        = false
FIXED         = false

# -- 4. Output -------------------------------------------------------------
IC_DIR     = "profiling/audit/output-large"
IC_PREFIX  = "profile-large"
IC_FORMAT  = "hdf5"
USE_DOUBLE = false
SAVE_WHITE_NOISE = false

# -- 5. Cosmology ----------------------------------------------------------
COSMOLOGY = "Planck2018EE+BAO+SN"
SPECTRUM  = "camb"
NONLINEAR = false

# -- 6. Misc ---------------------------------------------------------------
COMOVING     = true
HINDEPENDENT = true
ROTATE       = 0.0

# -- 7. Units (StePS defaults) ---------------------------------------------
UNIT_L_IN_CM     = 3.085678e24
UNIT_M_IN_G      = 1.989e44
UNIT_V_IN_KMPS   = 20.738652969844207

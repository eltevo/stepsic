# -- 1. Geometry and simulation volume ---------------------------------
#
#  GEOMETRY determines how the simulation volume is shaped. Options:
#
#    "cubical"        Standard periodic box.    TYPE = "grid", "random" or "glass".
#    "cylindrical"    StePS S^1 x R^2.          TYPE = "glass" or "shells".
#    "spherical"      StePS R^3.                TYPE = "glass" or "shells".

GEOMETRY = "cubical"

# ** Cubical geometry **************************************************
#  Box dimensions in [Mpc]. LBOX defines all three side lengths. You can
#  use a scalar to define a cubical box, or an array of `[ Lx, Ly, Lz ]`
#  for a rectangular cuboid.
LBOX = [ 1000, 1000, 1000 ]
#  Periodic boundary conditions in the form of `[ Px, Py, Pz ]`. In
# "cubical" gemoetry any of the three dimensions can be periodic. Use
# `true` or `1` for periodic, `false` or `0` for non-periodic. You can
# also use a single value to set periodicity for all dimensions at once.
PERIODIC = [ 1, 1, 1 ]

# ** Stereographic geometry ********************************************
#  These define the stereographic projection parameters. For cubical
#  geometry they are ignored by the code, but must still be present in
#  the file (validation will skip them in a future version).
#
#  Cylindrical (S^1 x R^2):
#    - R_3D sets the radius of the compactified R^2 plane
#    - LBOX[2] (Lz) sets the periodic non-compact dimension
#    - PERIODIC should be [0, 0, 1] (enforced in stepsic)
#
#  Spherical (R^3):
#    - R_3D sets the radius of the full simulation sphere
#    - LBOX is the bounding box (should box the sphere: Lx=Ly=Lz = 2*R_3D)
#    - PERIODIC should be [0, 0, 0] (enforced in stepsic)
R_3D = 500             # RADIUS of the simulated volume in Mpc in the Euclidean space.
D_4D = 75              # DIAMETER of the compactified hypersphere in [Mpc].
BIN_MODE = "omega"     # Binning mode of the multi-resolution stereographic projection in the radial direction, options: "omega", "volume".
NRBINS = 224           # Number of radial bins in the stereographic projection.

# ** Center of Interest ************************************************
#  The point around which the IC is centered. For cubical geometry this
#  shifts the box origin; for StePS geometries it sets the observer position.
COI = [ 0, 0, 0 ]      # Center of Interest [Mpc]


# -- 2. Particle generation --------------------------------------------
#
#  TYPE controls how particles are placed in the volume. Options:
#
#    "grid"      Regular lattice.             Cubical geometry only.
#    "random"    Poisson sampling.            Cubical geometry only.
#    "shells"    Concentric shell filling.    Cylindrical / spherical geometry only.
#    "glass"     Load a pre-built glass.      Any geometry.

TYPE = "glass"

# ** Cubical geometry **************************************************
NMESH = 64             # Grid cells per shortest dimension. Other dimensions will be scaled accordingly. Set to 0 for adaptive multiscale IC generation.
NPART = 32768          # Total particle count for TYPE = "random".

# ** Shells (cylindrical / spherical only) *****************************
#  Generates N_total = NSHELL * NRBINS particles, distributed in
#  concentric shells whose radii follow the stereographic binning.
NSHELL = 12288         # Particles per radial shell.

# ** Glass input (cubical or stereographic) ****************************
#  If TYPE = "glass", the initial particle distribution will be loaded
#  from a pre-built glass file. This file should contain the particle
#  positions in the same geometry as defined by the `GEOMETRY` parameter.
INPUT_GLASS = "./examples/input_glass.hdf5"   # Path to the input glass file.

# ** Adaptive multiscale (glass + NMESH=0) *****************************
NGRIDSAMPLES = 7       # Number of resolution levels for multiscale IC.

# ** Rotating IC (experimental) ****************************************
ROTATE = 0.0           # Add an angular velocity to the IC in rad / Gyr.


# -- 3. Perturbation theory --------------------------------------------

REDSHIFT = 63          # Target redshift
LPTORDER = 2           # Order of the LPT. Options: 1 (Zel'dovich), 2 (2LPT), 3 (3LPT).
INTERPOLATION = "tsc"  # Grid-to-particle interpolation to calculate displacements and velocities. Options: "ngp", "cic", "tsc".
COMPENSATE = true      # If `true`, the IC will be generated with a compensation kernel to pre-sharpen the field before interpolation. This is useful for reducing the smoothing effect of interpolation when using low-resolution meshes or high-order interpolation methods, especially in the case of glass IC where particles do not coincide with grid points. For regular lattices where particles coincide with grid points, this should be False.
SPHEREMODE = false     # If `true`, the IC will be generated in a spherical shell in k-space, otherwise it will be generated in a cubical box in k-space.
COUNTER = false        # If `true`, the IC will be generated with a phase flip in Fourier space.
PHASE_SHIFT = 0.0      # Phase shift to apply to the IC. This is useful for generating IC with a specific phase shift in the Fourier space, primarily to reduce the cosmic variance by pairing normal and antipodal simulations.

# TODO: Primordial non-Gaussianity


# -- 4. Input/output and format ----------------------------------------

# TODO: INPUT_WHITE_NOISE = "example/ic_white_noise.hdf5"  # Path to the input white noise file. If not provided, a `white noise` will be generated. This file should contain a 3D array of random numbers with the same shape as the mesh size defined by `NMESH`.
# TODO: INPUT_DELTA_K = "example/ic_delta_k.hdf5"  # Path to the input delta_k file. If not provided, a `delta_k` will be generated.
IC_DIR = "output"      # Output directory for the generated IC files (created if it does not exist).
IC_PREFIX = "stepsic"  # Filename prefix of the output files.
IC_FORMAT = "hdf5"     # Output file format. Options: "hdf5", "gadget", "ascii"
USE_DOUBLE = true      # If `true`, the output files will be saved in double precision. Otherwise, they will be saved in single precision.


# -- 5. Cosmology parameters -------------------------------------------
#
#  By default, we use parameters from table 2.20 of the Planck 2018 results
#  https://wiki.cosmos.esa.int/planck-legacy-archive/images/b/be/Baseline_params_table_2018_68pc.pdf
#  Select a built-in parameter set from stepsic/config/cosmology.toml.
#  Any individual parameter below will override the selected set.

COSMOLOGY = "Planck2018EE+BAO+SN"

# ** Base parameters ***************************************************
# H0 = 67.742          # Hubble parameter at z=0 in km/s/Mpc
# OMEGA_M = 0.3099     # Matter density parameter
# OMEGA_B = 0.048891   # Baryon density parameter
# OMEGA_L = 0.6901     # Dark energy density parameter
# NS = 0.96822         # Scalar spectral index
# AS = 2.1064e-9       # Amplitude of the primordial power spectrum
# SIGMA8 = 0.8105      # RMS density fluctuation in spheres of 8 Mpc/h at z=0
# ** Additional species and thermal history ****************************
# YHE = 0.245421       # Helium mass fraction
# MNU = 0.06           # Sum of neutrino masses in eV
# NNU = 3.046          # Effective number of neutrino species
# ZREI = 7.89          # Reionization redshift
# TCMB = 2.7255        # CMB temperature in K
# KPIVOT = 0.05        # Pivot scale in Mpc^-1
# ** Dark energy EoS parameters ****************************************
# W0 = -1.0            # Dark energy equation of state parameter at z=0
# WA = 0.0             # Dark energy equation of state parameter evolution

# ** Power spectrum ****************************************************
SPECTRUM = "camb"   # Type of the power spectrum, options: "input", "camb".
NONLINEAR = false    # If `true`, the non-linear corrections will be applied to the power spectrum. In cosmological IC generation, this is not a valid method, as we approximate the linear regime with LPT.
HALOFIT = "mead2020"  # Check `camb.NonLinearModel.Halofit` for possible values.
INPUT_SPECTRUM = "./examples/LCDM2018_input_spectrum.txt"  # Path to the file with the power spectrum. This file should be in the format of two columns: log(k) and log(P^3(k)). If `SPECTRUM` is `camb`, this file will be ignored.
INPUT_SPECTRUM_UNIT_L_IN_CM = 3.085678e24

# -- 6. Internal units -------------------------------------------------
#
#  Default values are set to match StePS internal units.
UNIT_L_IN_CM = 3.085678e24           # Length unit in cm, default is 1 Mpc.
UNIT_M_IN_G = 1.989e44               # Mass unit in g, default is 1e11 M_sun.
UNIT_V_IN_KMPS = 20.738652969844207  # Velocity unit in km/s, default is the ratio of 1 Mpc and the Hubble length.
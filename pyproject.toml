[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stepsic"
version = "1.0.0b1"
authors = [
    { name = "Balazs Pal", email = "pal.balazs@ttk.elte.hu" },
    { name = "Gabor Racz", email = "gabor.racz@helsinki.fi" },
]
description = "StePS cosmological initial condition generator"
readme = "README.md"
license = "GPL-2.0-or-later"
requires-python = ">=3.10"
keywords = [
    "cosmology",
    "initial-conditions",
    "n-body",
    "stereographic-projection",
    "lagrangian-perturbation-theory",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "toml",
    "tabulate",
    "h5py",
    "numpy>=1.22",
    "scipy>=1.8",
    "astropy>=5.0",
    "camb",
    "colossus",
]

[project.optional-dependencies]
gadget = ["glio"]
test = ["pytest>=8"]

[project.scripts]
stepsic = "stepsic.stepsic:main"

[project.urls]
Homepage = "https://github.com/eltevo/stepsic"
Documentation = "https://eltevo.github.io/projects/stepsic"
Repository = "https://github.com/eltevo/stepsic"
"Bug Tracker" = "https://github.com/eltevo/stepsic/issues"

[tool.isort]
profile = "black"
known_first_party = ["stepsic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers -m 'not slow'"
markers = [
    "slow: >2s; excluded from default run",
    "camb: requires CAMB/Colossus calls",
]
filterwarnings = ["error"]
